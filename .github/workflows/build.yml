name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project QuePersonajeEres.xcodeproj \
            -scheme QuePersonajeEres \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Zip the .app for download
        run: |
          APP_PATH=$(find build -name "*.app" -maxdepth 6 | head -n 1)
          echo "App encontrada en: $APP_PATH"
          mkdir -p artifact
          cp -R "$APP_PATH" artifact/
          cd artifact && zip -r ../QuePersonajeEres.zip .

      - name: Upload .app as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuePersonajeEres-app
          path: QuePersonajeEres.zip
